name: Restore One Release ZIP to R2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Calibration release tag (YYYYMMDD)
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload-to-r2:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PREFIX: ${{ secrets.R2_PREFIX }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install R2 dependency
        run: python -m pip install 'boto3>=1.34,<2'

      - name: Download the exact Release ZIP
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p build/r2-restore
          gh release download \
            "${RELEASE_TAG}" \
            --dir build/r2-restore \
            --pattern "${RELEASE_TAG}.zip"

      - name: Upload the immutable ZIP to R2
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m tcal_pipeline.upload_to_r2 \
            --zip "build/r2-restore/${RELEASE_TAG}.zip" \
            --date "${RELEASE_TAG}"
